[package]
name = "plethora-core"
description = "The plethora pipeline stages: trimming, coverage, GC correction and the 1000 Genomes chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# In-process alignment through bwa-mem4. Off by default: bwa-mem4 depends on
# rust-htslib and libsais unconditionally, so enabling this pulls hts-sys,
# libsais-sys, bzip2, lzma and zstd, and with them a C toolchain and bindgen.
# None of that is used here, since the aligner is asked for SAM and noodles
# writes the BAM; it is transitive weight that everyone who does not align
# would otherwise pay. See IPNP-BIPN/bwa-mem4 for making those optional there.
# NOT USABLE YET, and the version pin below says why. bwa-mem4 4.3.2 takes
# needletail with its default features, which pull `liblzma`. That declares
# `links = "lzma"`, and so does the `lzma-sys` that `zip` reaches through
# trim-galore; cargo refuses any graph with two crates linking one native
# library, so enabling this against 4.3.2 fails at resolution. The fix is
# IPNP-BIPN/bwa-mem4#62; bump to 4.3.3 when it is published and this works.
# The code, and everything below, is written and was verified against that
# branch: index, align, coverage and gc-correct run end to end in one process.
align = ["dep:bwa-mem4"]

[dependencies]
plethora-compat = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

noodles-bam = "0.94"
noodles-bgzf = "0.51"
noodles-core = "0.20"
noodles-fasta = "0.66"
noodles-sam = "0.89"
flate2 = "1"
rapidgzip-core = "0.3.1"
md-5 = "0.10"
trim-galore = "2.3.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
rayon = "1.12.0"
bwa-mem4 = { version = "4.3.3", optional = true, default-features = false, features = ["fast-gzip", "parallel-gzip"] }

[dev-dependencies]
tempfile = "3"
plethora-compat = { workspace = true }

[lints]
workspace = true
