[package]
name = "plethora-core"
description = "The plethora pipeline stages: trimming, coverage, GC correction and the 1000 Genomes chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# In-process alignment through bwa-mem4. Off by default, but only because not
# every run aligns: since IPNP-BIPN/bwa-mem4#62, #63 and #64 the aligner no
# longer drags htslib, bindgen or mimalloc behind it, so `default-features =
# false` below leaves `hts-sys` out of the graph entirely. What it still adds
# over a build without this feature is the C libsais that `bwa-index` uses by
# default, and libdeflate.
#
# #62 is the one that makes the dependency possible at all: before it,
# needletail's default features pulled `liblzma`, which declares
# `links = "lzma"` and collides with the `lzma-sys` that `zip` reaches through
# trim-galore. That is a resolution failure, so the feature could not even be
# declared.
align = ["dep:bwa-mem4"]

[dependencies]
plethora-compat = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

noodles-bam = "0.95"
noodles-bgzf = "0.51"
noodles-core = "0.20"
noodles-fasta = "0.66"
noodles-sam = "0.90"
flate2 = "1"
rapidgzip-core = "0.3.1"
md-5 = "0.11"
trim-galore = "2.3.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
rayon = "1.12.0"
bwa-mem4 = { version = "4.3.3", optional = true, default-features = false, features = ["fast-gzip", "parallel-gzip"] }

[dev-dependencies]
tempfile = "3"
plethora-compat = { workspace = true }

[lints]
workspace = true
